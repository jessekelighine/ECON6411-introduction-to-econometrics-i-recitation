name: publish-pdfs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-science \
            biber

      - name: Build PDFs
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find . -maxdepth 1 -type d -name '[0-9][0-9]-*' -printf '%f\n' | sort)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No directories found matching NN-*" >&2
            exit 1
          fi
          mkdir -p dist
          for dir in "${dirs[@]}"; do
            make -C "$dir"
            pdf="$dir/$dir.pdf"
            if [ ! -f "$pdf" ]; then
              echo "Expected $pdf but it was not found" >&2
              exit 1
            fi
            cp "$pdf" dist/
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: dist/*.pdf
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDFs artifact
        uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: dist

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pdf
